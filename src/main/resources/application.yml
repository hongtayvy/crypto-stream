spring:
  application:
    name: crypto-stream
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: crypto-stream
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.cryptostream.model.CryptoTick
        spring.json.trusted.packages: com.example.cryptostream.model

crypto:
  topic: crypto.ticks
  # Auto-start the upstream WebSocket connection on boot. Turn off if you'd rather
  # kick ingestion via the REST API (POST /api/ingest/start).
  auto-start: true
  source:
    # Public Coinbase Exchange market-data feed. No API key required for these channels.
    url: wss://ws-feed.exchange.coinbase.com
    channel: ticker
    products:
      - BTC-USD
      - ETH-USD
      - SOL-USD
  sink:
    # Where processed events get appended as JSON lines.
    file: data/processed-ticks.jsonl

logging:
  level:
    com.example.cryptostream: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
